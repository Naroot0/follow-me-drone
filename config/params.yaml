# Every tunable number in the system lives here. Every rule in control/ can be
# stated as one if-then sentence that references only these names.
# Units: meters, seconds, meters per second, degrees.

station:
  distance_m: 3.0          # criterion 2; raised from 2.5 m (decision 34)
  distance_band_m: 1.0     # plus or minus; widened from 0.5 m, so the band is 2.0 to 4.0 m (decision 35)
  distance_floor_m: 1.5    # hard floor, controller never commands closer
  angle_deg: 180           # 180 = directly behind the person; unused in Phase 1 (trailing follow), Phase 2 orbit sweeps this
  height_above_m: 1.5      # above the person's head, not above the ground (about 3.2 m above ground for a 1.75 m person)

acquisition:
  timeout_s: 30            # give up and land if nobody is enrolled by then (was 10 s; criterion 1 itself is unchanged)
  hold_s: 5                # one person must be the largest box, nearly still, this long to enroll
  still_max_motion: 0.15   # smoothed box-centre speed in box heights per second; bench value, retune on the airframe
  still_smooth_frames: 10  # centre is averaged over this many frames before measuring motion
  enroll_range_min_m: 2
  enroll_range_max_m: 4

reacquisition:
  occlusion_max_s: 5       # criterion 3; longer than this declares a loss
  reid_similarity_threshold: 0.70   # cosine similarity, logged on every match; unvalidated against a second person
  reid_margin: 0.05        # best candidate must beat the second by this much to re-lock
  reacquire_frames: 5      # consecutive frames the same candidate must win before re-lock

loss:
  hover_then_land_after_s: 25   # after occlusion_max_s; total reacquisition window 30 s (decision 32)

approach:
  trigger_m: 1.0           # the person closing by more than this while the drone hovers counts as approaching
  speed_threshold_mps: 0.3 # the person moving toward the drone faster than this blocks reverse
                           # response: hover and yaw, no retreat; the person walks past (decision 32)

search:                    # yaw behaviour while the person is lost (decision 32); built in the flight state machine task
  yaw_rate_dps: 30
  edge_fraction: 0.15      # last box centre within this fraction of a frame edge counts as leaving by that edge
  # lost mid-frame: hold heading. Left by a side edge: yaw that way. Left by the bottom edge: yaw 180 degrees.
  # Not found: continue to one full turn, then hover until the land timer expires.

obstacle:
  stop_distance_m: 1.5     # criterion 4
  sidestep_m: 1.0

orbit:                     # Phase 2 (decision 36); unused in v1.0
  half_circle_deg: 180
  rate_deg_s: 15
  person_still_speed_mps: 0.3

limits:
  max_speed_mps: 2.0       # 4.5 mph over the ground, any horizontal direction; a 4 mph walk is 1.8 m/s (decision 46)
  max_altitude_agl_m: 10
  geofence_radius_m: 0     # 0 = off for follow flights (decision 46); set a radius only for tests flown in one spot
  command_rate_hz: 10
  max_yaw_rate_dps: 90
  max_reverse_mps: 0.5     # reverse speed limit; reverse is for brake recovery only (decision 33)
  max_reverse_distance_m: 1.0   # most the drone backs up in one brake recovery (decision 33)
  max_vertical_mps: 1.0    # climb or descent the watchdog lets through; the controller commands zero in this version
  watchdog_timeout_s: 0.5  # no fresh command for this long: the watchdog sends a hover command

watchdog:                  # src/safety/watchdog.py; values below are first settings, not yet flown
  land_after_s: 2.0        # no fresh command, or no position, for this long: land in place (decision 44)
  heartbeat_timeout_s: 3.0 # the autopilot sends a heartbeat every second; three missed in a row: land
  stick_deadband_us: 100   # a stick moved this far from where it was when the autonomy engaged stops the autonomy (10 percent of full stick travel)
  autonomy_mode: GUIDED    # any other autopilot mode means the pilot or a failsafe has control
  handover_mode: LOITER    # mode requested after a stick movement, so the sticks fly the aircraft; holds position with the sticks centred
  handover_speed_mps: 0.3  # the aircraft counts as stopped below this speed
  handover_max_wait_s: 2.0 # hand over after this long even if it has not slowed below handover_speed_mps
  throttle_mid_us: 1500    # middle of the throttle stick
  throttle_mid_band_us: 100  # hand over only with the throttle stick this close to the middle (a low stick means descend in the pilot modes)

control:
  # Structure agreed 2026-11-10 (decision 33). Gain values come from an offline simulation and are untuned until the SITL run.
  kp_distance: 1.0         # m/s of forward speed per metre of range error (was 0.6)
  kp_bearing: 3.0          # rad/s of yaw rate per radian of bearing error (0.8 originally; 2.0 let the person reach the view edge in the noisy SITL turn)
  kp_height: 0.7
  feedforward_gain: 1.0    # fraction of the person's estimated speed added to forward speed; 0 = pure proportional
  range_filter_alpha: 0.5  # alpha-beta filter on range; supplies the range rate for the feedforward
  range_filter_beta: 0.1
  reverse_window_s: 2.0    # reverse may start only this soon after the drone's own forward flight
  coast_s: 0.3             # hold the last command through missed frames this long, then hover; 0 disables

detector:
  model: yolo
  weights: yolo11n.pt      # Ultralytics YOLO11 nano, COCO pretrained, person class only (decision 26)
  input_width: 640
  input_height: 480
  confidence_min: 0.4
  target_fps: 15

tracker:
  config: config/bytetrack_followme.yaml   # ByteTrack, project settings (decision 27)
  detector_conf: 0.25      # conf passed to the detector when tracking. 0.1 produced fragment boxes and ID churn during crossings (2026-11-07).
                           # detector.confidence_min still gates enrollment and follow decisions.

reid:
  model: osnet_x0_25        # OSNet x0.25, MSMT17-trained, 512-d embedding (decision 28)
  weights: osnet_x0_25_msmt17.pt
  input_height: 256
  input_width: 128
  gallery_max: 30          # diverse embeddings kept per enrolled person; match = max similarity
  learn_every_frames: 15   # while LOCKED, add at most one gallery view this often
  learn_check_every_frames: 5   # while locked, re-ID runs on the target at most this often, and only until the gallery is full
  learn_max_similarity: 0.95  # skip near-duplicate views so the gallery covers poses

mavlink:
  connection: udpin:0.0.0.0:14551   # SITL via MAVProxy second output; the Jetson will use a serial port
  target_component: 1
  type_mask_velocity: 0x0DC7        # ignore position, acceleration, yaw, yaw rate (decision 31)
  type_mask_velocity_yawrate: 0x05C7  # as above but yaw rate commanded (bit 11 clear); controller use
  frame: MAV_FRAME_BODY_OFFSET_NED
  command_rate_hz: 10               # Guided times out below about 3 Hz
  autopilot_params:
    WP_YAW_BEHAVIOR: 0              # never auto-yaw; the controller owns yaw
    GUID_TIMEOUT: 0.5               # seconds the autopilot keeps flying the last Guided command; then it hovers (decision 47; default 3)
    FS_GCS_ENABLE: 5                # land when the Jetson's heartbeat stops (decision 46)
    FS_GCS_TIMEOUT: 3               # seconds without a heartbeat before that landing
    LOIT_SPEED_MS: 2.0              # Loiter top speed, m/s; matches limits.max_speed_mps (decision 46)
    PILOT_SPD_UP: 1.0               # pilot climb limit, m/s; matches limits.max_vertical_mps
    PILOT_SPD_DN: 1.0               # pilot descent limit, m/s
    # Names are those of ArduPilot 4.8.0-dev. The autopilot does not limit Guided velocity commands:
    # in Guided the speed limits are enforced by the controller and the watchdog only (decision 47).
